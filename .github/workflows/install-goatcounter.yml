name: Install GoatCounter pageview tracking

on:
  push:
    paths:
      - .github/workflows/install-goatcounter.yml

permissions:
  contents: write

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Insert GoatCounter script once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          original = p.read_text(encoding="utf-8")
          tag = '<script data-goatcounter="https://unwindrafid.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>\n'
          if "data-goatcounter=" in original:
              print("GoatCounter already present; no change.")
          else:
              ending = "</body></html>"
              if original.count(ending) != 1:
                  raise SystemExit("Unexpected HTML ending; no changes made.")
              p.write_text(original.replace(ending, tag + ending), encoding="utf-8")
              print("Inserted GoatCounter directly before closing body.")
          PY

      - name: Save the one-line change
        run: |
          if git diff --quiet -- index.html; then
            echo "Already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add GoatCounter pageview tracking"
          git push
